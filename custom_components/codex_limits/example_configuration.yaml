# Konfiguracja w configuration.yaml
#
# Jak zdobyć token:
# 1. Otwórz https://chatgpt.com/codex/cloud/settings/analytics
# 2. F12 -> Application -> Cookies -> chatgpt.com
# 3. Skopiuj wartość __Secure-next-auth.session-token.0
# 4. Skopiuj wartość __Secure-next-auth.session-token.1 (jeśli jest)
# 5. W Network znajdź zapytanie do /backend-api/wham/usage
#    i skopiuj z niego header "Authorization: Bearer ..."
#
# UWAGA: Token wygasa co ~3 dni. Trzeba go ręcznie odświeżać
#        lub napisać automatyzację HA do refreshu.

codex_limits:
  # Bearer token z headera Authorization zapytania do /wham/usage
  # Możesz podać z prefixem "Bearer " lub bez - kod obsłuży obie wersje
  session_token: "eyJhbGciOiJSUzI1NiIs..."

  # Opcjonalnie - ciasteczka sesyjne (w razie potrzeby)
  # cookie: "key1=value1; key2=value2"

  # Opcjonalnie - device ID z headera OAI-Device-Id
  # device_id: "a5850256-33cf-49f5-8405-72c17c01046f"

  # Co ile sekund sprawdzać (domyślnie 120)
  # scan_interval: 120

