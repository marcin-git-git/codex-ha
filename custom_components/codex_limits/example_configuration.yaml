# Przykładowa konfiguracja w configuration.yaml

codex_limits:
  api_url: "https://api.codex.example.com/limits"
  scan_interval: 60
  # api_key: "twój-klucz-api"  # opcjonalnie
  # headers:                    # opcjonalnie - dodatkowe nagłówki
  #   X-Custom: "wartosc"
  limits:                       # opcjonalnie - dostosowanie limitów
    5h:
      name: "Limit 5-godzinny"
      max: 5
    5d:
      name: "Limit 5-dniowy"
      max: 5

